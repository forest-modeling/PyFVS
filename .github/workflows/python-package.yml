# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build Packages

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12","3.13","3.14"]
        os: [ubuntu-latest, windows-latest] #, macos-latest]
        compiler: [gcc]
        compiler-version: [13, 15]
        exclude:
          - os: windows-latest
            compiler-version: 15
          - os: ubuntu-latest
            compiler-version: 13

    steps:
    - name: Fortran Setup
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: 'x64'
        cache: 'pip'
        
    - name: show-versions
      run: |
        gcc --version
        gfortran --version
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install numpy build wheel setuptools setuptools_scm meson-python pytest ninja

    - name: Install Patchelf
      if: runner.os == 'Linux'
      run: |
        python -m pip install patchelf
        
    - name: Build and package
      run: |
        python -m build --no-isolation
        
    - name: Store Wheel
      uses: actions/upload-artifact@v4
      with:
        name: pyfvs-${{ runner.os }}-py${{ matrix.python-version }}-wheels
        path: dist/*.whl
        if-no-files-found: warn
        overwrite: true
        
    - name: Store Sdist
      uses: actions/upload-artifact@v4
      with:
        name: pyfvs-sdist
        path: dist/*.tar.gz
        if-no-files-found: warn
        overwrite: true

    - name: Test with pytest
      working-directory: .
      shell: bash
      run: |
        ls dist
        pip install confuse typing-extensions openpyxl click pandas matplotlib 
        pip install dist/*.whl
        pytest

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          
      - name: Publish to TestPyPI
        if: github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/  # Directs upload to TestPyPI
        
