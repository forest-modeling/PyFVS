name: Publish to TestPyPI

on:
  workflow_run:
    workflows: ["Build Packages"] # Must match the 'name' of your primary build workflow
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run if the main build succeeded and the branch is 'dev'
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    
    permissions:
      id-token: write  # Required for Trusted Publishing
    
    steps:
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/  # Directs upload to TestPyPI
