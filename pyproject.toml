[build-system]
# AVOID CHANGING REQUIRES: IT WILL BE UPDATED BY PYSCAFFOLD!
requires = [
  "setuptools>=64",
  "setuptools_scm[toml]>=8",
  "wheel",
  "meson",
  "meson-python>=0.20.0",
  "numpy",
  "ninja",
  "patchelf ; platform_system == 'linux'",
#  "cython",
  "build"
  ]
build-backend = "mesonpy"

[project]
name = "pyfvs"
description = "Python wrappers and utilities for using the Forest Vegetation Simulator"
authors = [
  {name="Tod Haren", email="2239672+tharen@users.noreply.github.com"},
  ]
license = {file="LICENSE"}
readme = {file="README.md", content-type="text/markdown"}
keywords = ["Forest Modeling", "FVS"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
]

dynamic = ["version"]

dependencies = [
  "confuse",
  "click",
  "pandas",
  "numpy",
  "typing-extensions", # required by confuse
  ]

[project.urls]
repository = "https://github.com/forest-modeling/PyFVS"
homepage = "https://github.com/forest-modeling/PyFVS"
bug-tracker = "https://github.com/forest-modeling/PyFVS/issues"
documentation = "https://deepwiki.com/forest-modeling/PyFVS"

[project.scripts]
pyfvs = "pyfvs.__main__:cli"

[dependency-groups]
test = [
  "pytest",
  "openpyxl"
]
dev = [
  "pytest",
]

[tool.setuptools]
packages = ["pyfvs",]

[tool.setuptools_scm]
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "post-release"
# version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
version_file = "src/pyfvs/_version.py"

[tool.devpy]
package = 'pyfvs'  # used by pytest
commands = ['devpy.build', 'devpy.test']

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.cibuildwheel]
test-requires = ["pytest","openpyxl"]
test-command = "pytest {project}/tests"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.tasks.dev]
cmd = [
  "python", "-m", "pip", "install", "-e", ".", 
  "--no-build-isolation", "--verbose", 
  "-Csetup-args=-Dfvsvariants={{ variants }}",
  "-Csetup-args=-Dbuildtype={{ mode }}",
  ]
args = [
    {"arg" = "variants", default="pn,wc,so,op,oc,ec,ca,nc,bm,ie,ci,ak,ws"},
    {"arg" = "mode", default="debug"}
  ]

[tool.pixi.tasks.build]
cmd = [
  "python", "-m", "build", 
  "--no-isolation", "--verbose", 
  "-Csetup-args=-Dfvsvariants={{ variants }}",
  "-Csetup-args=-Dbuildtype={{ mode }}",
  ]
args = [
    {"arg" = "variants", default="pn,wc,so,op,oc,ec,ca,nc,bm,ie,ci,ak,ws"},
    {"arg" = "mode", default="release"}
  ]

[tool.pixi.tasks.test]
cmd = "pytest tests"

[tool.pixi.dependencies]
# Python runtime and build tools
python = "3.14.*"
# Build system dependencies
wheel = ">=0.47.0,<0.48"
meson = ">=1.11.1,<2"
meson-python = ">=0.20.0,<0.21"
setuptools = ">=82.0.1,<83"
setuptools_scm = ">=10.2.0,<11"
pip = ">=26.1.2,<27"
# Compilers and toolchain
gcc = ">=15.2.0,<15.3"
gxx = ">=15.2.0,<15.3"
gfortran = ">=15.2.0,<15.3"
# Project runtime and dev dependencies (pinned for reproducibility)
# These should be kept in sync with [project] dependencies and [dependency-groups]
numpy = ">=2.5.0,<3"
pandas = ">=3.0.3,<4"
click = ">=8.4.1,<9"
confuse = ">=2.2.0,<3"
pytest = ">=9.1.1,<10"
openpyxl = ">=3.1.5,<4"

[tool.pixi.pypi-dependencies]
build = ">=1.5.0, <2"
