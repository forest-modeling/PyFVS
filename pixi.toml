[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tasks.dev]
cmd = [
  "python", "-m", "pip", "install", "-e", ".", 
  "--no-build-isolation", "--verbose", 
  "-Csetup-args=-Dfvsvariants={{ variants }}",
  "-Csetup-args=-Dbuildtype={{ mode }}",
  "-Cbuild-dir={{ builddir }}"
  ]
args = [
    {"arg" = "variants", default="pn,wc,so,op,oc,ec,ca,nc,bm,ie,ci,ak,ws"},
    {"arg" = "mode", default="debug"},
    {"arg" = "builddir", default="build"}
  ]

[tasks.build]
cmd = [
  "python", "-m", "build", 
  "--no-isolation", "--verbose", 
  "-Csetup-args=-Dfvsvariants={{ variants }}",
  "-Csetup-args=-Dbuildtype={{ mode }}",
  "-Cbuild-dir={{ builddir }}"
  ]
args = [
    {"arg" = "variants", default="pn,wc,so,op,oc,ec,ca,nc,bm,ie,ci,ak,ws"},
    {"arg" = "mode", default="release"},
    {"arg" = "builddir", default="build"}
  ]

[tasks.test]
cmd = "pytest tests"

[dependencies]
# Python runtime and build tools
python = "3.14.*"
# Build system dependencies
wheel = ">=0.47.0,<0.48"
meson = ">=1.11.1,<2"
meson-python = ">=0.20.0,<0.21"
setuptools = ">=82.0.1,<83"
setuptools_scm = ">=10.2.0,<11"
pip = ">=26.1.2,<27"
# Compilers and toolchain
gcc = ">=15.2.0,<15.3"
gxx = ">=15.2.0,<15.3"
gfortran = ">=15.2.0,<15.3"
# Project runtime and dev dependencies (pinned for reproducibility)
# These should be kept in sync with [project] dependencies and [dependency-groups]
numpy = ">=2.5.0,<3"
pandas = ">=3.0.3,<4"
click = ">=8.4.1,<9"
confuse = ">=2.2.0,<3"
pytest = ">=9.1.1,<10"
openpyxl = ">=3.1.5,<4"

[pypi-dependencies]
build = ">=1.5.0, <2"
